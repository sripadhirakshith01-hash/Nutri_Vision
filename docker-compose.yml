services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: NUTRITION_DATABASE
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-nutrivision}
    volumes:
      - nutrivision-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pnutrivision"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    ports:
      - "8080:8000"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: NUTRITION_DATABASE
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-nutrivision}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      SERVE_FRONTEND: "true"
      MODEL_PATH: /app/food101_model.keras
      CLASS_NAMES_PATH: /app/class_names.json
      AI_PROVIDER: ${AI_PROVIDER:-auto}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
    depends_on:
      mysql:
        condition: service_healthy

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://web:8000
    depends_on:
      - web

volumes:
  nutrivision-mysql:
